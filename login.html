<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>login</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
            integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="login.css" />
    </head>
    <body>
        <div class="log-in">
            <div class="log-in-slider">
                <div class="slider"></div>
            </div>
            <div class="blank-line"></div>
            <div class="log-in-input">
                <div class="log-in-input-box">
                    <!-- <div class="input"> -->

                    <!-- <p>"Join thousands of happy customers today!"</p> -->
                    <div class="content">
                        <div class="log-in-logo">
                            <img
                                src="image/ShopVerse-logo.png"
                                alt="ShopVerse logo"
                                class="log-in-logo-img" />
                        </div>
                        <div class="log-in-heading">
                            <h1>Log in your ShopVerse account</h1>
                        </div>
                        <form class="log-in-form">
                            <div class="input-group">
                                <p>Email:</p>
                                <input id="email" type="email" placeholder="Enter Email" />
                            </div>
                            <div class="input-group">
                                <p>Password:</p>
                                <div class="password-field">
                                    <input id="password"
                                        type="password"
                                        placeholder="Enter Password"/>
                                    <div class="password-icon">
                                        <i class="fa-solid fa-eye"></i>
                                    </div>

                                </div>
                            </div>
                            <div class="log-in-button">
                                <button type="submit">Log in</button>
                            </div>
                        </form>
                        <div class="log-in-dont-have-account">
                            <p>
                                Don't have an account?
                                <a href="signup.html">Sign up</a>
                            </p>
                        </div>
                    </div>
                    <!-- </div> -->
                </div>
            </div>
        </div>
        <script src="login.js"></script>
    </body>
</html>
